name: msf-hoi
channels:
  - defaults
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - scikit-learn
  - rtree
  - faiss-cpu=1.12.0
  - pyyaml
  - h5py
  - tqdm
  - pip:
      - --index-url https://download.pytorch.org/whl/cu130
      - --extra-index-url https://pypi.python.org/simple
      - diffusers
      - transformers
      - torch==2.9.0
      - torchvision==0.24.0
      - smplx
      - tomlkit
      - wandb
      - omegaconf
      - trimesh
      - clip
      - h5py
      - libigl
      - joblib
      - tqdm
